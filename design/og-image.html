<!doctype html>
<!--
  Source for public/og-image.png (1200 x 630), the link preview card used by LinkedIn, WhatsApp, Slack, X...
  Colours are the "Slate & Muted Indigo" tokens from src/styles/tokens.css.

  Re-render after editing (adjust the Chrome path for your OS):
    chrome --headless=new --screenshot=public/og-image.png --window-size=1200,630 --virtual-time-budget=8000 design/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Graph card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=block"
    />
    <style>
      :root {
        --canvas: #0b0e14;
        --border: #2b3040;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --text-tertiary: #8190a8;
        --accent-primary-text: #818cf8;
        --accent-secondary: #38bdf8;
        --on-accent: #0b0e14;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--canvas); }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
        font-family: "Geist", system-ui, sans-serif;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }
      /* faint blueprint grid on a 64px (8 x 8) cell, same as the site hero */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(226 232 240 / 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(226 232 240 / 0.04) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 80% 90% at 20% 0%, #000 25%, transparent 80%);
      }
      body > * { position: relative; }
      .brand { display: flex; align-items: center; gap: 24px; }
      .badge {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 8px;
        background: var(--accent-secondary);
        color: var(--on-accent);
        font: 500 24px/1 "Geist Mono", ui-monospace, monospace;
      }
      .label { font: 500 18px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.24em; color: var(--text-secondary); }
      h1 {
        font-size: 128px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, var(--text-primary) 35%, #999fa6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tagline { margin-top: 16px; font-size: 40px; line-height: 1.3; letter-spacing: -0.01em; color: var(--text-primary); }
      .tagline em { font-family: "Instrument Serif", Georgia, serif; font-size: 1.1em; font-style: italic; color: var(--accent-primary-text); }
      .footer { display: flex; align-items: center; justify-content: space-between; font: 500 20px/1 "Geist Mono", ui-monospace, monospace; }
      .pill { padding: 16px 24px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); }
      .url { color: var(--text-tertiary); }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="badge">AC</span>
      <span class="label">PORTFOLIO</span>
    </div>

    <div>
      <h1>Anuj Chaudhary</h1>
      <p class="tagline">Full Stack, Data Analytics &amp; <em>Machine Learning</em></p>
    </div>

    <div class="footer">
      <span class="pill">IIT Kanpur · Mechanical Engineering</span>
      <span class="url">my-portfolio-blush-psi-24.vercel.app</span>
    </div>
  </body>
</html>
